<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="beeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#805426" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#beeShadow)" transform="translate(10, 10)">
    <!-- Alitas transparentes con aleteo -->
    <ellipse cx="48" cy="22" rx="14" ry="24" fill="#e8f4f8" stroke="#a7c8da" stroke-width="1.8" opacity="0.85" transform="rotate(-30 48 22)" />
    <path d="M 44 26 Q 48 16 52 10" fill="none" stroke="#bad4e2" stroke-width="1.2" />
    
    <ellipse cx="68" cy="18" rx="14" ry="24" fill="#e8f4f8" stroke="#a7c8da" stroke-width="1.8" opacity="0.85" transform="rotate(20 68 18)" />
    <path d="M 64 22 Q 68 12 72 6" fill="none" stroke="#bad4e2" stroke-width="1.2" />

    <!-- Aguijón simpático -->
    <polygon points="12,52 2,55 12,58" fill="#3b2310" />

    <!-- Cuerpo redondeado de la abejita -->
    <ellipse cx="52" cy="55" rx="36" ry="26" fill="#ffcb2b" stroke="#3b2310" stroke-width="2.5" />

    <!-- Franjas oscuras características -->
    <path d="M 40 32 Q 44 55 40 78" fill="none" stroke="#3b2310" stroke-width="5" stroke-linecap="round" />
    <path d="M 56 30 Q 60 55 56 80" fill="none" stroke="#3b2310" stroke-width="5" stroke-linecap="round" />

    <!-- Cabecita / Cara tierna -->
    <circle cx="78" cy="53" r="16" fill="#ffcb2b" stroke="#3b2310" stroke-width="2.5" />

    <!-- Mejilla sonrojada -->
    <circle cx="76" cy="61" r="5" fill="#ff9999" opacity="0.65" />

    <!-- Ojito brillante y tierno -->
    <ellipse cx="80" cy="48" rx="3.5" ry="4.5" fill="#3b2310" />
    <circle cx="81.5" cy="46.5" r="1.5" fill="#ffffff" />

    <!-- Sonrisita -->
    <path d="M 86 54 Q 89 59 84 62" fill="none" stroke="#3b2310" stroke-width="2" stroke-linecap="round" />

    <!-- Antenitas con bolita dorada -->
    <path d="M 84 38 Q 88 28 94 26" fill="none" stroke="#3b2310" stroke-width="2" stroke-linecap="round" />
    <circle cx="95" cy="25" r="2.5" fill="#ffcb2b" stroke="#3b2310" stroke-width="1.5" />

    <path d="M 76 38 Q 74 27 70 24" fill="none" stroke="#3b2310" stroke-width="2" stroke-linecap="round" />
    <circle cx="69" cy="23" r="2.5" fill="#ffcb2b" stroke="#3b2310" stroke-width="1.5" />
  </g>
</svg>
