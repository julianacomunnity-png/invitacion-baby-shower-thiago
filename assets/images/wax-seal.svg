<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#5a3512" flood-opacity="0.35" />
    </filter>
    <linearGradient id="goldWax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed668" />
      <stop offset="35%" stop-color="#f5af19" />
      <stop offset="70%" stop-color="#d48806" />
      <stop offset="100%" stop-color="#a05d00" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eed8b3" />
      <stop offset="100%" stop-color="#c9ad84" />
    </linearGradient>
  </defs>

  <!-- Cintas de tela debajo del sello -->
  <g filter="url(#sealShadow)">
    <path d="M 68 85 L 45 145 L 60 135 L 75 145 L 74 95 Z" fill="url(#ribbonGrad)" />
    <path d="M 86 85 L 85 145 L 100 135 L 115 145 L 94 95 Z" fill="url(#ribbonGrad)" />
  </g>

  <!-- Sello de cera con bordes orgánicos irregulares -->
  <g filter="url(#sealShadow)">
    <path d="M 80 18
             C 95 16 110 22 122 32
             C 134 42 143 56 142 72
             C 144 88 136 104 125 116
             C 114 128 98 136 82 135
             C 66 137 50 129 38 118
             C 26 106 18 90 20 74
             C 19 58 27 42 40 32
             C 52 20 65 19 80 18 Z" 
          fill="url(#goldWax)" />
    
    <!-- Anillo interior grabado en la cera -->
    <circle cx="80" cy="76" r="44" fill="none" stroke="#fff4cc" stroke-width="2.5" opacity="0.6" />
    <circle cx="80" cy="76" r="41" fill="none" stroke="#7e4a10" stroke-width="2" opacity="0.4" />

    <!-- Relieve de Abejita en el centro del sello -->
    <g transform="translate(48, 48) scale(0.55)">
      <!-- Alitas en relieve -->
      <ellipse cx="44" cy="24" rx="12" ry="20" fill="#fff7d6" opacity="0.8" transform="rotate(-30 44 24)" />
      <ellipse cx="64" cy="20" rx="12" ry="20" fill="#fff7d6" opacity="0.8" transform="rotate(25 64 20)" />
      <!-- Cuerpo -->
      <ellipse cx="54" cy="50" rx="30" ry="22" fill="#70410e" />
      <ellipse cx="54" cy="50" rx="27" ry="19" fill="#ffcf40" />
      <path d="M 44 32 Q 47 50 44 68" fill="none" stroke="#70410e" stroke-width="4.5" stroke-linecap="round" />
      <path d="M 58 31 Q 61 50 58 69" fill="none" stroke="#70410e" stroke-width="4.5" stroke-linecap="round" />
      <!-- Cabeza -->
      <circle cx="74" cy="49" r="14" fill="#ffcf40" stroke="#70410e" stroke-width="2" />
      <circle cx="76" cy="45" r="2.5" fill="#70410e" />
      <!-- Antenas -->
      <path d="M 80 37 Q 85 28 90 27" fill="none" stroke="#70410e" stroke-width="2" stroke-linecap="round" />
      <path d="M 73 37 Q 71 28 68 25" fill="none" stroke="#70410e" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Destello de luz sobre la cera -->
    <ellipse cx="60" cy="45" rx="22" ry="10" fill="#ffffff" opacity="0.35" transform="rotate(-30 60 45)" />
  </g>
</svg>
